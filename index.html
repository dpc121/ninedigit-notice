<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NINEDIGIT Notice Generator</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Arial,sans-serif;
  background:#0f172a;
  color:#fff;
}
header{
  background:#020617;
  padding:14px;
  text-align:center;
  font-weight:700;
  font-size:18px;
}
.container{
  padding:12px;
  max-width:720px;
  margin:auto;
}
textarea,select,input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  margin-top:10px;
}
textarea{min-height:140px}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  margin-top:10px;
  cursor:pointer;
}
.row{display:flex;gap:8px}
.row>*{flex:1}

.btn-green{background:#22c55e}
.btn-blue{background:#38bdf8}
.btn-red{background:#ef4444}
.btn-purple{background:#a855f7}

.output{
  background:#020617;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  white-space:pre-line;
  font-size:15px;
}

.preview{display:none;gap:10px;margin-top:14px}
.preview-box{
  background:#020617;
  border-radius:14px;
  padding:12px;
  font-size:14px;
}

.history{margin-top:18px}
.history-item{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  font-size:14px;
  cursor:pointer;
}

.footer{
  text-align:center;
  opacity:.6;
  font-size:12px;
  margin:14px 0;
}
</style>
</head>

<body>

<header>📢 NINEDIGIT Notice Generator</header>

<div class="container">

<!-- Preset Templates -->
<select id="templateSelect">
  <option value="">📋 Select Preset Template</option>
  <option value="payment">💳 Payment Instruction</option>
  <option value="apology">😔 Apology / Sorry</option>
  <option value="resume">▶ Service Resume</option>
  <option value="alert">🚨 Alert</option>
</select>

<textarea id="noticeInput" placeholder="Yahan notice likhiye..."></textarea>

<div class="row">
<select id="rewriteTone">
  <option value="strict">🧠 Strict</option>
  <option value="polite">🙏 Polite</option>
  <option value="friendly">😊 Friendly</option>
</select>
<button class="btn-purple" onclick="rewritePreview()">✨ Rewrite Preview</button>
</div>

<button class="btn-green" onclick="generate()">Format • Copy • Save</button>

<div class="row">
<button class="btn-blue" onclick="shareChannel()">📤 WhatsApp Channel</button>
<button class="btn-red" onclick="clearAll()">🧹 Clear All</button>
</div>

<div class="output" id="output"></div>

<div class="history">
<h3>🕘 Notice History</h3>
<input type="text" id="search" placeholder="🔍 Search history..." oninput="loadHistory()">
<button class="btn-red" onclick="clearHistory()">🗑️ Clear History</button>
<div id="historyList"></div>
</div>

<div class="footer">
Emoji Smart • Hindi / English • WhatsApp Channel Ready • PWA
</div>

</div>

<script>
/* ---------- ELEMENTS ---------- */
const noticeInput = document.getElementById("noticeInput");
const output = document.getElementById("output");
const historyList = document.getElementById("historyList");
const search = document.getElementById("search");
const templateSelect = document.getElementById("templateSelect");
const rewriteTone = document.getElementById("rewriteTone");

const HISTORY_KEY = "ninedigit_history";
const CHANNEL_URL = "https://whatsapp.com/channel/0029Vaz55kDLo4hcKwcuqi0b";

/* ---------- TEMPLATE APPLY ---------- */
templateSelect.addEventListener("change",()=>{
  const t = templateSelect.value;

  if(t==="payment"){
noticeInput.value=
`Payment Instruction (Mandatory)

Payment sirf in apps se karein:
PhonePe
Google Pay
Paytm
Amazon Pay

Kisi aur app se payment na karein`;
  }

  if(t==="apology"){
noticeInput.value=
`Dear Users

Pichhle kuch din se service delay ke liye hum sincerely maafi chahte hain

Aaj se sabhi pending kaam solve kiye ja rahe hain

Aapke cooperation ke liye dhanyavaad`;
  }

  if(t==="resume"){
noticeInput.value=
`Service Resume Update

Aaj se sabhi services resume ho chuki hain

Sabhi pending works fast process kiye ja rahe hain

Aap bina tension apply kar sakte hain`;
  }

  if(t==="alert"){
noticeInput.value=
`Important Alert

Fake calls aur fake payment requests se savdhan rahein

Sirf official channel se hi information lein`;
  }
});

/* ---------- EMOJI ENGINE ---------- */
function isHindi(text){
  return /[\u0900-\u097F]/.test(text);
}

function beautifyText(raw){
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  let out=[];

  lines.forEach((line,i)=>{
    const hi=isHindi(line);

    if(i===0){
      out.push(hi?`🔥 *${line.toUpperCase()}* 🔥`:`⭐ *${line.toUpperCase()}* ⭐`);
    }
    else if(/₹|rs|only|price/i.test(line)){
      out.push(hi?`💰 ${line}`:`💲 ${line}`);
    }
    else if(/am|pm|baje|time|hours/i.test(line)){
      out.push(`⏰ ${line}`);
    }
    else if(/phonepe|gpay|paytm|amazon/i.test(line)){
      out.push(`💳 ${line}`);
    }
    else if(/no |nahi|not /i.test(line)){
      out.push(`❌ ${line}`);
    }
    else if(/verified|original|safe|secure|trusted|approval/i.test(line)){
      out.push(`✅ ${line}`);
    }
    else{
      out.push(hi?`👉 ${line}`:`🔹 ${line}`);
    }
  });

  return out.join("\n");
}

/* ---------- REWRITE PREVIEW ---------- */
function rewritePreview(){
  const t=noticeInput.value.trim();
  if(!t){alert("Text likhiye");return;}
  let r=t;
  if(rewriteTone.value==="strict") r="Kindly note that "+t;
  if(rewriteTone.value==="polite") r="Aapse nivedan hai: "+t;
  if(rewriteTone.value==="friendly") r="Jankari ke liye: "+t;
  noticeInput.value=r;
}

/* ---------- GENERATE ---------- */
function generate(){
  const t=noticeInput.value.trim();
  if(!t){alert("Pehle notice likhiye");return;}

  const msg =
`📢 *OFFICIAL NOTICE*

${beautifyText(t)}

━━━━━━━━━━━━━━
— Admin | NINEDIGIT`;

  output.innerText=msg;
  navigator.clipboard.writeText(msg);
  saveHistory(msg);
  loadHistory();
}

/* ---------- HISTORY ---------- */
function saveHistory(m){
  let h=JSON.parse(localStorage.getItem(HISTORY_KEY))||[];
  h.unshift(m);
  h=h.slice(0,20);
  localStorage.setItem(HISTORY_KEY,JSON.stringify(h));
}

function loadHistory(){
  const q=search.value.toLowerCase();
  const h=JSON.parse(localStorage.getItem(HISTORY_KEY))||[];
  historyList.innerHTML="";
  h.filter(x=>x.toLowerCase().includes(q)).forEach(n=>{
    const d=document.createElement("div");
    d.className="history-item";
    d.innerText=n.split("\n")[0]+" ...";
    d.onclick=()=>{
      output.innerText=n;
      navigator.clipboard.writeText(n);
    };
    historyList.appendChild(d);
  });
}

function clearHistory(){
  if(confirm("Clear history?")){
    localStorage.removeItem(HISTORY_KEY);
    loadHistory();
  }
}

function clearAll(){
  noticeInput.value="";
  output.innerText="";
}

/* ---------- WHATSAPP CHANNEL ---------- */
function shareChannel(){
  if(!output.innerText){
    alert("Pehle notice generate kijiye");
    return;
  }
  navigator.clipboard.writeText(output.innerText);
  window.open(CHANNEL_URL,"_blank");
  alert("Notice copy ho gaya.\nChannel open ho gaya – paste karke post karein.");
}

/* ---------- INIT ---------- */
loadHistory();
</script>

</body>
</html>
