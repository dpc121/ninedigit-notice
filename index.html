<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- 🔥 MOST IMPORTANT FOR MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NINEDIGIT Notice Generator</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  font-family: system-ui, -apple-system, Arial, sans-serif;
  background:#0f172a;
  color:#fff;
}

header{
  background:#020617;
  padding:14px 10px;
  font-size:18px;
  text-align:center;
  font-weight:700;
}

.container{
  padding:12px;
  max-width:720px;
  margin:auto;
}

textarea, input, select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  margin-top:10px;
}

textarea{ min-height:120px; }

button{
  width:100%;
  margin-top:10px;
  padding:15px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn-green{ background:#22c55e; }
.btn-blue{ background:#38bdf8; }
.btn-red{ background:#ef4444; }
.btn-purple{ background:#a855f7; }

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row > *{
  flex:1 1 48%;
}

/* Output */
.output{
  margin-top:14px;
  background:#020617;
  border-radius:16px;
  padding:14px;
  white-space:pre-line;
  font-size:15px;
}

/* Rewrite Preview */
.preview{
  display:none;
  margin-top:14px;
  gap:10px;
  flex-direction:column;
}
.preview-box{
  background:#020617;
  border-radius:16px;
  padding:12px;
  font-size:14px;
}
.preview-title{
  font-weight:700;
  opacity:.8;
  margin-bottom:6px;
}

/* History */
.history{
  margin-top:18px;
}
.history-item{
  background:#020617;
  padding:12px;
  border-radius:14px;
  margin-bottom:8px;
  font-size:14px;
  cursor:pointer;
}

/* Desktop enhancement */
@media (min-width:768px){
  .preview{ flex-direction:row; }
  .preview-box{ flex:1; }
}

.footer{
  text-align:center;
  opacity:.7;
  margin:14px 0;
  font-size:13px;
}
</style>
</head>

<body>

<header id="title">📢 NINEDIGIT Notice Generator</header>

<div class="container">

<!-- 🌐 Language -->
<select id="langSwitch" onchange="switchLang()">
  <option value="en">🌐 English</option>
  <option value="hi">🌐 Hindi</option>
  <option value="hinglish">🌐 Hinglish</option>
</select>

<!-- ✍️ Input -->
<textarea id="noticeInput" placeholder="Type notice here..."></textarea>

<!-- 🧠 Rewrite -->
<div class="row">
  <select id="rewriteTone">
    <option value="strict">🧠 Strict</option>
    <option value="polite">🙏 Polite</option>
    <option value="friendly">😊 Friendly</option>
  </select>
  <button class="btn-purple" onclick="showRewritePreview()">✨ Rewrite Preview</button>
</div>

<!-- 🔄 Preview -->
<div class="preview" id="previewBox">
  <div class="preview-box">
    <div class="preview-title">Before</div>
    <div id="beforeText"></div>
  </div>
  <div class="preview-box">
    <div class="preview-title">After</div>
    <div id="afterText"></div>
  </div>
</div>

<div class="row" id="previewActions" style="display:none">
  <button class="btn-green" onclick="applyRewrite()">✔ Apply</button>
  <button class="btn-red" onclick="cancelRewrite()">❌ Cancel</button>
</div>

<!-- 📢 Notice Type -->
<select id="noticeType">
  <option value="alert">🚨 Alert</option>
  <option value="resume">▶ Service Resume</option>
  <option value="info">ℹ️ Info</option>
  <option value="happy">😊 Positive</option>
  <option value="request">🙏 Request</option>
  <option value="sorry">😔 Apology</option>
  <option value="warning">⚠️ Warning</option>
</select>

<button class="btn-green" onclick="generateNotice()">Format • Copy • Save</button>
<button class="btn-blue" onclick="shareWhatsApp()">📤 WhatsApp Share</button>
<button class="btn-red" onclick="clearAllData()">🧹 Clear All Data</button>

<div class="output" id="outputBox"></div>

<!-- 🕘 History -->
<div class="history">
<h3>🕘 Notice History</h3>
<input type="text" id="searchBox" placeholder="🔍 Search history..." oninput="loadHistory()">
<button class="btn-red" onclick="clearHistory()">🗑️ Clear History</button>
<div id="historyList"></div>
</div>

<div class="footer">Mobile-First • AI-Style Rewrite • WhatsApp Ready</div>
</div>

<script>
const historyKey="ninedigit_notice_history";
let currentLang="en";
let rewrittenText="";

/* 🌐 Language Labels */
const labels={
en:{title:"📢 NINEDIGIT Notice Generator",placeholder:"Type notice here...",heading:"OFFICIAL NOTICE",dept:"DL SERVICES – PUC (Pollution Under Control)",admin:"Admin | Official Channel – NINEDIGIT"},
hi:{title:"📢 नाइनडिजिट नोटिस जनरेटर",placeholder:"यहाँ नोटिस लिखें...",heading:"आधिकारिक सूचना",dept:"डीएल सेवाएँ – पीयूसी",admin:"एडमिन | आधिकारिक चैनल – NINEDIGIT"},
hinglish:{title:"📢 NINEDIGIT Notice Generator",placeholder:"Yahan notice ka text likhiye...",heading:"OFFICIAL NOTICE",dept:"DL Services – PUC (Pollution Under Control)",admin:"Admin | Official Channel – NINEDIGIT"}
};

function switchLang(){
currentLang=langSwitch.value;
title.innerText=labels[currentLang].title;
noticeInput.placeholder=labels[currentLang].placeholder;
}

/* 🧠 Rewrite Logic */
function rewriteText(text,tone){
if(tone==="strict") return "Kindly note that "+text;
if(tone==="polite") return "Aapse nivedan hai ki dhyan dein: "+text;
return "Jankari ke liye bataya ja raha hai: "+text;
}

function showRewritePreview(){
const t=noticeInput.value.trim();
if(!t){alert("Text likhiye");return;}
rewrittenText=rewriteText(t,rewriteTone.value);
beforeText.innerText=t;
afterText.innerText=rewrittenText;
previewBox.style.display="flex";
previewActions.style.display="flex";
}
function applyRewrite(){
noticeInput.value=rewrittenText;
hidePreview();
}
function cancelRewrite(){ hidePreview(); }
function hidePreview(){
previewBox.style.display="none";
previewActions.style.display="none";
}

/* 📢 Notice */
function getIcon(t){
return{alert:"🚨",resume:"▶",info:"ℹ️",happy:"😊",request:"🙏",sorry:"😔",warning:"⚠️"}[t];
}
function generateNotice(){
const t=noticeInput.value.trim();
if(!t){alert("Notice text required");return;}
const L=labels[currentLang];
const notice=`
${getIcon(noticeType.value)} ${L.heading}

${L.dept}

• ${t}

Date: ${new Date().toLocaleDateString("en-GB")}
— ${L.admin}
`.trim();
outputBox.innerText=notice;
navigator.clipboard.writeText(notice);
saveHistory(notice);
loadHistory();
}

/* 🕘 History */
function saveHistory(n){
let h=JSON.parse(localStorage.getItem(historyKey))||[];
h.unshift(n); h=h.slice(0,20);
localStorage.setItem(historyKey,JSON.stringify(h));
}
function loadHistory(){
const q=searchBox.value.toLowerCase();
const h=JSON.parse(localStorage.getItem(historyKey))||[];
historyList.innerHTML="";
h.filter(x=>x.toLowerCase().includes(q)).forEach(n=>{
let d=document.createElement("div");
d.className="history-item";
d.innerText=n.split("\n")[0]+" ...";
d.onclick=()=>{outputBox.innerText=n;navigator.clipboard.writeText(n);};
historyList.appendChild(d);
});
}
function clearHistory(){
if(confirm("Clear history?")){localStorage.removeItem(historyKey);loadHistory();}
}
function clearAllData(){
if(confirm("Clear ALL data?")){
localStorage.clear();
noticeInput.value="";
outputBox.innerText="";
loadHistory();
}
}
function shareWhatsApp(){
if(!outputBox.innerText){alert("Generate notice first");return;}
window.open("https://wa.me/?text="+encodeURIComponent(outputBox.innerText));
}
loadHistory();
</script>

</body>
</html>
