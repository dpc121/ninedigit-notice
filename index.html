<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- 🔥 MUST FOR MOBILE & PWA -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NINEDIGIT Notice App</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notice App">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family: system-ui, -apple-system, Arial, sans-serif;
  background:#0f172a;
  color:#fff;
  overscroll-behavior:none;
}

header{
  background:#020617;
  padding:14px;
  text-align:center;
  font-size:18px;
  font-weight:700;
}

.container{
  padding:12px;
  max-width:600px;
  margin:auto;
}

/* Mobile-first inputs */
textarea, input, select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  margin-top:10px;
}

textarea{min-height:120px;}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  margin-top:10px;
}

.btn-green{background:#22c55e;}
.btn-blue{background:#38bdf8;}
.btn-red{background:#ef4444;}
.btn-purple{background:#a855f7;}

.row{
  display:flex;
  gap:8px;
}
.row > *{flex:1;}

.output{
  background:#020617;
  border-radius:16px;
  padding:14px;
  margin-top:14px;
  white-space:pre-line;
}

/* Preview mobile vertical */
.preview{
  display:none;
  flex-direction:column;
  gap:10px;
  margin-top:14px;
}
.preview-box{
  background:#020617;
  border-radius:16px;
  padding:12px;
}

.footer{
  text-align:center;
  opacity:.6;
  font-size:12px;
  margin:12px 0;
}
</style>
</head>

<body>

<header>📢 NINEDIGIT Notice App</header>

<div class="container">

<textarea id="noticeInput" placeholder="Yahan notice likhiye..."></textarea>

<div class="row">
  <select id="rewriteTone">
    <option value="strict">🧠 Strict</option>
    <option value="polite">🙏 Polite</option>
    <option value="friendly">😊 Friendly</option>
  </select>
  <button class="btn-purple" onclick="rewritePreview()">✨ Rewrite</button>
</div>

<div class="preview" id="preview">
  <div class="preview-box" id="beforeBox"></div>
  <div class="preview-box" id="afterBox"></div>
</div>

<button class="btn-green" onclick="generate()">Generate Notice</button>
<button class="btn-blue" onclick="share()">📤 WhatsApp</button>

<div class="output" id="output"></div>

<div class="footer">Installable • Offline • App-like</div>
</div>

<script>
// Register Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

function rewritePreview(){
  const t=noticeInput.value.trim();
  if(!t){alert("Text likhiye");return;}
  const tone=rewriteTone.value;
  let r=t;
  if(tone==="strict") r="Kindly note that "+t;
  if(tone==="polite") r="Aapse nivedan hai: "+t;
  if(tone==="friendly") r="Jankari ke liye: "+t;
  preview.style.display="flex";
  beforeBox.innerText="Before:\n"+t;
  afterBox.innerText="After:\n"+r;
  noticeInput.value=r;
}

function generate(){
  const t=noticeInput.value.trim();
  output.innerText="🚨 OFFICIAL NOTICE\n\n• "+t+"\n\n— NINEDIGIT";
}

function share(){
  if(!output.innerText)return;
  window.open("https://wa.me/?text="+encodeURIComponent(output.innerText));
}
</script>

</body>
</html>
