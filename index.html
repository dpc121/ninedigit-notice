<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NINEDIGIT Notice Generator</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Arial;
  background:#0f172a;
  color:#fff;
}
header{
  background:#020617;
  padding:14px;
  text-align:center;
  font-weight:700;
}
.container{
  padding:12px;
  max-width:720px;
  margin:auto;
}
textarea,select,input,button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
  margin-top:10px;
}
textarea{min-height:140px}
button{font-weight:700;cursor:pointer}
.row{display:flex;gap:8px}
.row>*{flex:1}

.btn-green{background:#22c55e}
.btn-blue{background:#38bdf8}
.btn-red{background:#ef4444}
.btn-purple{background:#a855f7}

.output{
  background:#020617;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  white-space:pre-line;
}
.history-item{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin-top:6px;
  cursor:pointer;
}
.footer{text-align:center;opacity:.6;font-size:12px;margin:14px}
</style>
</head>

<body>

<header>📢 NINEDIGIT Notice Generator</header>

<div class="container">

<select id="templateSelect">
  <option value="">📋 Select Preset Template</option>
  <option value="payment">💳 Payment Instruction</option>
  <option value="apology">😔 Apology</option>
  <option value="resume">▶ Service Resume</option>
  <option value="alert">🚨 Alert</option>
</select>

<textarea id="noticeInput" placeholder="Yahan notice likhiye..."></textarea>

<div class="row">
  <select id="rewriteTone">
    <option value="strict">🧠 Strict</option>
    <option value="polite">🙏 Polite</option>
    <option value="friendly">😊 Friendly</option>
  </select>
  <button id="rewriteBtn" class="btn-purple">✨ Rewrite</button>
</div>

<button id="generateBtn" class="btn-green">Format • Copy • Save</button>

<div class="row">
  <button id="shareBtn" class="btn-blue">📤 WhatsApp Channel</button>
  <button id="clearBtn" class="btn-red">🧹 Clear All</button>
</div>

<div class="output" id="output"></div>

<h3>🕘 Notice History</h3>
<input id="search" placeholder="🔍 Search history">
<button id="clearHistoryBtn" class="btn-red">🗑️ Clear History</button>
<div id="historyList"></div>

<div class="footer">Emoji Smart • WhatsApp Channel Ready • PWA</div>
</div>

<script>
/* ELEMENTS */
const noticeInput = document.getElementById("noticeInput");
const output = document.getElementById("output");
const historyList = document.getElementById("historyList");
const search = document.getElementById("search");

const HISTORY_KEY="ninedigit_history";
const CHANNEL_URL="https://whatsapp.com/channel/0029Vaz55kDLo4hcKwcuqi0b";

/* TEMPLATE */
templateSelect.onchange=()=>{
  if(templateSelect.value==="payment"){
noticeInput.value=`Payment Instruction

Payment sirf:
PhonePe
Google Pay
Paytm
Amazon Pay

Kisi aur app se payment na karein`;
  }
  if(templateSelect.value==="apology"){
noticeInput.value=`Dear Users

Delay ke liye hum sincerely sorry hain
Aaj se sabhi pending kaam clear honge`;
  }
  if(templateSelect.value==="resume"){
noticeInput.value=`Service Resume Update

Aaj se sabhi services resume`;
  }
  if(templateSelect.value==="alert"){
noticeInput.value=`Important Alert

Fake calls se savdhan rahein`;
  }
};

/* EMOJI */
function isHindi(t){return /[\u0900-\u097F]/.test(t)}
function beautify(raw){
  return raw.split("\n").filter(Boolean).map((l,i)=>{
    if(i===0) return isHindi(l)?`🔥 *${l}* 🔥`:`⭐ *${l}* ⭐`;
    if(/₹|rs|price/i.test(l)) return `💰 ${l}`;
    if(/am|pm|time/i.test(l)) return `⏰ ${l}`;
    if(/no |nahi/i.test(l)) return `❌ ${l}`;
    return isHindi(l)?`👉 ${l}`:`🔹 ${l}`;
  }).join("\n");
}

/* REWRITE */
rewriteBtn.onclick=()=>{
  if(!noticeInput.value) return;
  if(rewriteTone.value==="strict") noticeInput.value="Kindly note that "+noticeInput.value;
  if(rewriteTone.value==="polite") noticeInput.value="Aapse nivedan hai: "+noticeInput.value;
  if(rewriteTone.value==="friendly") noticeInput.value="Jankari ke liye: "+noticeInput.value;
};

/* GENERATE */
generateBtn.onclick=()=>{
  if(!noticeInput.value) return alert("Notice likhiye");
  const msg=`📢 OFFICIAL NOTICE\n\n${beautify(noticeInput.value)}\n\n— NINEDIGIT`;
  output.innerText=msg;
  navigator.clipboard.writeText(msg);
  save(msg);
  load();
};

/* HISTORY */
function save(m){
  let h=JSON.parse(localStorage.getItem(HISTORY_KEY))||[];
  h.unshift(m); h=h.slice(0,20);
  localStorage.setItem(HISTORY_KEY,JSON.stringify(h));
}
function load(){
  historyList.innerHTML="";
  (JSON.parse(localStorage.getItem(HISTORY_KEY))||[])
  .filter(x=>x.toLowerCase().includes(search.value.toLowerCase()))
  .forEach(n=>{
    const d=document.createElement("div");
    d.className="history-item";
    d.innerText=n.split("\n")[0];
    d.onclick=()=>output.innerText=n;
    historyList.appendChild(d);
  });
}
search.oninput=load;
clearHistoryBtn.onclick=()=>{localStorage.removeItem(HISTORY_KEY);load();}
clearBtn.onclick=()=>{noticeInput.value="";output.innerText="";}
shareBtn.onclick=()=>{
  if(!output.innerText) return;
  navigator.clipboard.writeText(output.innerText);
  window.open(CHANNEL_URL,"_blank");
};

load();
</script>

</body>
</html>
