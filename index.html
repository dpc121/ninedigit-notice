/* ---------- Emoji Engine ---------- */
function isHindi(text){
  return /[\u0900-\u097F]/.test(text);
}

function beautifyTextV2(raw){
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  let out=[];

  lines.forEach((line,i)=>{
    const hi=isHindi(line);

    if(i===0){
      out.push(hi
        ? `🔥 *${line.toUpperCase()}* 🔥`
        : `⭐ *${line.toUpperCase()}* ⭐`);
    }
    else if(/₹|rs|only|price/i.test(line)){
      out.push(hi?`💰 ${line}`:`💲 ${line}`);
    }
    else if(/am|pm|baje|time|hours/i.test(line)){
      out.push(`⏰ ${line}`);
    }
    else if(/phonepe|gpay|paytm|amazon/i.test(line)){
      out.push(`💳 ${line}`);
    }
    else if(/no |nahi|not |❌/i.test(line)){
      out.push(`❌ ${line}`);
    }
    else if(/verified|original|safe|secure|trusted|approval/i.test(line)){
      out.push(`✅ ${line}`);
    }
    else{
      out.push(hi?`👉 ${line}`:`🔹 ${line}`);
    }
  });

  return out.join("\n");
}
