<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NINEDIGIT PRO Notice Generator</title>

<style>
body{
 margin:0;font-family:system-ui,Arial;
 background:#020617;color:white;
}
header{
 background:#020617;padding:12px;text-align:center;
 font-weight:bold;font-size:18px;border-bottom:1px solid #1f2937;
}
.container{padding:12px;max-width:720px;margin:auto;}
textarea,input,select,button{
 width:100%;padding:12px;margin-top:8px;border-radius:12px;
 border:none;font-size:15px;background:#0f172a;color:white;
}
button{font-weight:bold;cursor:pointer}
.green{background:#22c55e}
.blue{background:#38bdf8}
.red{background:#ef4444}
.output{
 background:#020617;padding:12px;border-radius:12px;margin-top:10px;
 white-space:pre-line;border:1px solid #1f2937;
}
.history-item{
 background:#020617;padding:8px;margin-top:5px;border-radius:8px;
 border:1px solid #1f2937;cursor:pointer;
}
</style>
</head>

<body>

<header>📢 NINEDIGIT PRO NOTICE GENERATOR</header>

<div class="container">

<select id="template">
<option value="">📋 Select Template</option>
<option value="pay">Payment Notice</option>
<option value="warn">Warning Alert</option>
<option value="service">Service Update</option>
</select>

<textarea id="input" placeholder="Notice yahan likho..."></textarea>

<button id="generate" class="green">Generate Notice</button>
<button id="share" class="blue">Share WhatsApp</button>
<button id="clear" class="red">Clear</button>

<div class="output" id="output"></div>

<h3>History</h3>
<div id="history"></div>

</div>

<script>
// ================= TEMPLATES =================
const templates={
 pay:`Payment Notice
Only PhonePe / GPay / Paytm accepted
49 Rs charges
Refer bonus 20 Rs`,
 warn:`⚠️ Important Warning
Fake calls se savdhan
Official number se hi baat karein`,
 service:`Service Update
Aaj se sabhi services resume`
};
template.onchange=e=>{
 input.value=templates[e.target.value]||"";
};

// ============== 10,000 STYLE EMOJI ENGINE =================

// Category Emoji Packs
const EMOJI = {
 title:["🔥","🚀","⚡","⭐","🌟","🎉","💥","✨"],
 money:["💰","💳","🪙","💵","🏦","📈"],
 warning:["🚨","⚠️","❗","❌","🔴"],
 offer:["🎁","🎉","🔥","💯","✨"],
 general:[
 "😀","😎","🤩","😍","😜","🤔","😱","🥳","🔥","⚡","✨","💎","📢","📌",
 "🔔","👉","👇","👍","🙏","💯","🎉","📞","💬","🧠","🚀","🌈","☀️","🌙"
 ]
};

// Prevent repeat emoji
let usedEmoji=[];

function randFrom(arr){
 let e;
 do{
  e = arr[Math.floor(Math.random()*arr.length)];
 }while(usedEmoji.includes(e));
 usedEmoji.push(e);
 if(usedEmoji.length>100) usedEmoji=[]; // reset buffer
 return e;
}

// Smart Emoji Selector
function smartEmoji(line){
 line=line.toLowerCase();
 if(/rs|₹|price|charge|pay/.test(line)) return randFrom(EMOJI.money);
 if(/alert|warning|fake|fraud/.test(line)) return randFrom(EMOJI.warning);
 if(/offer|bonus|free|gift/.test(line)) return randFrom(EMOJI.offer);
 return randFrom(EMOJI.general);
}

// Beautify Text
function beautify(text){
 usedEmoji=[];
 return text.split("\n").filter(x=>x).map((l,i)=>{
   if(i==0) return randFrom(EMOJI.title)+" *"+l+"* "+randFrom(EMOJI.title);
   return smartEmoji(l)+" "+l;
 }).join("\n");
}

// ================= GENERATE =================
generate.onclick=()=>{
 if(!input.value) return alert("Notice likho");
 const msg=`📢 OFFICIAL NOTICE\n\n${beautify(input.value)}\n\n— NINEDIGIT`;
 output.innerText=msg;
 navigator.clipboard.writeText(msg);
 saveHistory(msg);
 loadHistory();
};

// ================= SHARE =================
share.onclick=()=>{
 const t=encodeURIComponent(output.innerText);
 window.open("https://wa.me/?text="+t,"_blank");
};

// ================= CLEAR =================
clear.onclick=()=>{
 input.value="";output.innerText="";
};

// ================= HISTORY =================
function saveHistory(m){
 let h=JSON.parse(localStorage.getItem("hist"))||[];
 h.unshift(m);h=h.slice(0,20);
 localStorage.setItem("hist",JSON.stringify(h));
}
function loadHistory(){
 history.innerHTML="";
 (JSON.parse(localStorage.getItem("hist"))||[]).forEach(n=>{
  let d=document.createElement("div");
  d.className="history-item";
  d.innerText=n.split("\n")[0];
  d.onclick=()=>output.innerText=n;
  history.appendChild(d);
 });
}
loadHistory();
</script>

</body>
</html>
